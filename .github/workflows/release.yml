name: Build and release app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Test, build and publish
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run synthetic tests
        run: python -m unittest test_engine test_ui test_artwork test_performance_safety test_nsp test_compatibility test_emulator_patch test_dlc test_file_drops
      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean Packager.spec
      - name: Check frozen NSP builds
        run: python frozen_smoke.py
      - name: Assemble allowlisted release
        run: python package_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = python -c "import sys; sys.path.insert(0,'src'); import engine; print(engine.VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read app version.' }
          $tag = 'v' + $version
          $assets = @(Get-ChildItem -LiteralPath release -Filter '*.zip' -File | ForEach-Object FullName)
          $assets += (Join-Path (Get-Location) 'release/SHA256SUMS.txt')
          gh release create $tag @assets --target $env:GITHUB_SHA --title "NSP Box $version" --notes-file release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release could not be created. Existing releases are never overwritten; use a new app version.' }

  macos:
    name: Test, build and publish macOS app
    # The Windows job creates the release and the shared source ZIP first;
    # this job only adds the macOS artifacts and never overwrites existing ones.
    needs: windows
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run synthetic tests
        run: python -m unittest test_engine test_ui test_artwork test_performance_safety test_nsp test_compatibility test_emulator_patch test_dlc test_file_drops
      - name: Generate bundle icon
        run: python -c "from PIL import Image; Image.open('src/assets/icons/app.png').convert('RGBA').save('app.icns', sizes=[(16,16),(32,32),(64,64),(128,128),(256,256),(512,512),(1024,1024)])"
      - name: Build portable binary and app bundle
        run: python -m PyInstaller --noconfirm --clean Packager-macOS.spec
      - name: Check frozen NSP builds
        run: python frozen_smoke.py
      - name: Assemble allowlisted release
        run: python package_release.py
      - name: Package app bundle DMG
        run: |
          version=$(python -c "import sys; sys.path.insert(0,'src'); import engine; print(engine.VERSION)")
          case "$(uname -m)" in arm64) arch=arm64;; *) arch=x64;; esac
          hdiutil create -volname "NSP Box $version" -srcfolder dist/NSP-Box.app -ov -format UDZO "release/NSP-Box-v$version-macOS-$arch.dmg"
      - name: Publish macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(python -c "import sys; sys.path.insert(0,'src'); import engine; print(engine.VERSION)")
          tag="v$version"
          shasum -a 256 release/NSP-Box-"$tag"-macOS-*.zip release/NSP-Box-"$tag"-macOS-*.dmg > release/SHA256SUMS-macOS.txt
          existing=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for f in release/NSP-Box-"$tag"-macOS-*.zip release/NSP-Box-"$tag"-macOS-*.dmg release/SHA256SUMS-macOS.txt; do
            name=$(basename "$f")
            if printf '%s\n' "$existing" | grep -qx "$name"; then
              echo "Skipping $name: an asset with that name already exists (releases are never overwritten)."
            else
              gh release upload "$tag" "$f"
            fi
          done
